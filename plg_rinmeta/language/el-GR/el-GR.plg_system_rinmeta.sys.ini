PLG_SYSTEM_RINMETA="RinMeta"
PLG_SYSTEM_RINMETA_XML_DESC="Προσθέτει Open Graph και Twitter tags σε σελίδες άρθρων και, προαιρετικά, στην αρχική σελίδα της τρέχουσας γλώσσας."

; Params
PLG_SYSTEM_RINMETA_INCLUDE_ARTICLES_LABEL="Εφαρμογή σε σελίδες άρθρων"
PLG_SYSTEM_RINMETA_INCLUDE_ARTICLES_DESC="Αν ενεργοποιηθεί, το plugin θα προσθέτει Open Graph και Twitter tags στις σελίδες άρθρων του com_content."
PLG_SYSTEM_RINMETA_INCLUDE_HOMEPAGE_LABEL="Εφαρμογή και στην αρχική σελίδα"
PLG_SYSTEM_RINMETA_INCLUDE_HOMEPAGE_DESC="Αν ενεργοποιηθεί, το plugin θα προσθέτει Open Graph και Twitter tags και στο προεπιλεγμένο menu item της τρέχουσας γλώσσας, ακόμα κι όταν η αρχική αποτελείται μόνο από modules."
PLG_SYSTEM_RINMETA_ACCOUNT_LABEL="Όνομα Χρήστη στο X"
PLG_SYSTEM_RINMETA_ACCOUNT_DESC="Παρακαλούμε συμπληρώστε το όνομα χρήστη σας στο X βάζοντας και το σύμβολο @ στην αρχή."
PLG_SYSTEM_RINMETA_SUMMARY_CARD="Summary Card"
PLG_SYSTEM_RINMETA_SUMMARY_CARD_LARGE_IMAGE="Summary Card with Large Image"
PLG_SYSTEM_RINMETA_TYPE_LABEL="Τύπος Κάρτας"
PLG_SYSTEM_RINMETA_TYPE_DESC="Παρακαλούμε επιλέξτε τον τύπο κάρτας στο X."
PLG_SYSTEM_RINMETA_APPID_LABEL="Facebook App ID"
PLG_SYSTEM_RINMETA_APPID_LABEL_DESC="Για να χρησιμοποιήσετε το Facebook Insights, πρέπει να προσθέσετε το αναγνωριστικό εφαρμογής (App ID) στη σελίδα σας. Το Insights σάς επιτρέπει να προβάλλετε αναλυτικά στοιχεία για την επισκεψιμότητα στον ιστότοπό σας από το Facebook."
PLG_SYSTEM_RINMETA_HOMEPAGE_TITLE_LABEL="Τίτλος αρχικής σελίδας"
PLG_SYSTEM_RINMETA_HOMEPAGE_TITLE_DESC="Προαιρετικός τίτλος για τα social tags της αρχικής σελίδας. Αν μείνει κενό, χρησιμοποιείται ο τίτλος του menu item ή το όνομα του site."
PLG_SYSTEM_RINMETA_HOMEPAGE_DESC_LABEL="Περιγραφή αρχικής σελίδας"
PLG_SYSTEM_RINMETA_HOMEPAGE_DESC_DESC="Προαιρετική περιγραφή για τα social tags της αρχικής σελίδας. Αν μείνει κενό, χρησιμοποιείται η meta description του menu item, η description του document ή η global meta description."
PLG_SYSTEM_RINMETA_HOMEPAGE_IMAGE_LABEL="Εικόνα αρχικής σελίδας"
PLG_SYSTEM_RINMETA_HOMEPAGE_IMAGE_DESC="Προαιρετική εικόνα για τα social tags της αρχικής σελίδας."
PLG_SYSTEM_RINMETA_DEFAULT_IMAGE_LABEL="Προεπιλεγμένη εικόνα"
PLG_SYSTEM_RINMETA_DEFAULT_IMAGE_DESC="Προαιρετική fallback εικόνα όταν ένα άρθρο ή η αρχική σελίδα δεν έχει διαθέσιμη εικόνα."
