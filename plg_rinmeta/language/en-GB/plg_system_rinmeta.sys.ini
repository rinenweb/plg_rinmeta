PLG_SYSTEM_RINMETA="RinMeta"
PLG_SYSTEM_RINMETA_XML_DESC="Add Open Graph and Twitter tags to article pages and, optionally, to the language-specific homepage."

; Params
PLG_SYSTEM_RINMETA_INCLUDE_ARTICLES_LABEL="Apply to article pages"
PLG_SYSTEM_RINMETA_INCLUDE_ARTICLES_DESC="If enabled, the plugin will add Open Graph and Twitter tags to com_content article pages."
PLG_SYSTEM_RINMETA_INCLUDE_HOMEPAGE_LABEL="Apply to homepage too"
PLG_SYSTEM_RINMETA_INCLUDE_HOMEPAGE_DESC="If enabled, the plugin will add Open Graph and Twitter tags to the current language default menu item too, even when the homepage is module-only."
PLG_SYSTEM_RINMETA_ACCOUNT_LABEL="X username"
PLG_SYSTEM_RINMETA_ACCOUNT_DESC="Type your X username with @ at the beginning."
PLG_SYSTEM_RINMETA_SUMMARY_CARD="Summary Card"
PLG_SYSTEM_RINMETA_SUMMARY_CARD_LARGE_IMAGE="Summary Card with Large Image"
PLG_SYSTEM_RINMETA_TYPE_LABEL="Type of Card"
PLG_SYSTEM_RINMETA_TYPE_DESC="Please choose the X Card type."
PLG_SYSTEM_RINMETA_APPID_LABEL="Facebook App ID"
PLG_SYSTEM_RINMETA_APPID_LABEL_DESC="In order to use Facebook Insights you must add the app ID to your page. Insights lets you view analytics for traffic to your site from Facebook."
PLG_SYSTEM_RINMETA_HOMEPAGE_TITLE_LABEL="Homepage title"
PLG_SYSTEM_RINMETA_HOMEPAGE_TITLE_DESC="Optional title for the homepage social tags. If empty, the menu item title or site name is used."
PLG_SYSTEM_RINMETA_HOMEPAGE_DESC_LABEL="Homepage description"
PLG_SYSTEM_RINMETA_HOMEPAGE_DESC_DESC="Optional description for the homepage social tags. If empty, the menu item meta description, document description, or global meta description is used."
PLG_SYSTEM_RINMETA_HOMEPAGE_IMAGE_LABEL="Homepage image"
PLG_SYSTEM_RINMETA_HOMEPAGE_IMAGE_DESC="Optional image for the homepage social tags."
PLG_SYSTEM_RINMETA_DEFAULT_IMAGE_LABEL="Default image"
PLG_SYSTEM_RINMETA_DEFAULT_IMAGE_DESC="Optional fallback image when an article or the homepage has no available image."

PLG_SYSTEM_RINMETA_ARTICLE_META_LABEL="Add article object tags"
PLG_SYSTEM_RINMETA_ARTICLE_META_DESC="If enabled, article pages also get og:type article properties: published/modified time, section (category) and tags."
PLG_SYSTEM_RINMETA_DESC_LIMIT_LABEL="Description length"
PLG_SYSTEM_RINMETA_DESC_LIMIT_DESC="Maximum number of characters used when the plugin auto-generates a description from the article text."
